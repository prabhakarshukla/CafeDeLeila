<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#161616">
  <link rel="manifest" href="/admin/manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="/admin/icons/admin-apple.png">
  <title>Café De Leila | Admin</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="admin.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <header><a href="#dashboard">Café De Leila <small>Admin</small></a><button id="logout" hidden>Sign out</button></header>
  <nav id="nav" aria-label="Admin navigation" hidden></nav>
  <main id="content">
    <p id="notice" role="status" aria-live="polite">Checking access…</p>
    <form id="login" hidden>
      <h1>Admin sign in</h1>
      <label>Email<input name="email" type="email" autocomplete="username" required></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      <button id="toggle-password" type="button" aria-pressed="false">Show password</button>
      <label class="remember-device"><input name="keepSignedIn" type="checkbox"> Keep me signed in on this device</label>
      <button type="submit">Sign in</button>
    </form>
    <section id="view" aria-label="Admin page" hidden></section>
  </main>
</body>
</html>

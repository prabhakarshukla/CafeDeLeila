<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse Café De Leila's full menu - Authentic Indian, Continental & Chinese cuisine. Filter by category, dietary preference, and search dishes.">
  <title>Menu | CAFÉ DE LEILA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/refinements.css">


</head>
<body class="menu-page">
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <div id="header-placeholder"></div><noscript><p class="demo-notice">Enable JavaScript to browse the menu and try the demo forms.</p></noscript>

  <main id="main-content" role="main">
    <section class="menu-page" aria-labelledby="menu-title">
      <div class="container">
        <header style="margin-bottom: var(--space-xl);">
          <h1 id="menu-title" style="font-family: var(--font-heading); font-size: var(--text-4xl); font-weight: 600; margin-bottom: var(--space-xs);">Our Menu</h1>
          <p style="color: var(--color-text-secondary);">Browse dishes, filter by category or search by name.</p>
        </header>

        <!-- TOOLBAR -->
        <div class="menu-toolbar" role="search" aria-label="Menu filters and search">
          <div class="menu-toolbar__search">
            <svg class="menu-toolbar__search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="search" placeholder="Search dishes..." aria-label="Search menu items" autocomplete="off">
          </div>

          <div class="menu-toolbar__filters" role="group" aria-label="Dietary filters">
            <button class="filter-chip is-active" data-filter="all" role="button" aria-pressed="true" aria-controls="menu-grid">All</button>
            <button class="filter-chip" data-filter="veg" role="button" aria-pressed="false" aria-controls="menu-grid">
              <svg class="badge badge--veg" style="width:14px;height:14px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 12l2 2 4-4"/></svg> Veg
            </button>
            <button class="filter-chip" data-filter="nonveg" role="button" aria-pressed="false" aria-controls="menu-grid">
              <svg class="badge badge--nonveg" style="width:14px;height:14px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 12c0 2.21-1.79 4-4 4S10 14.21 10 12"/><path d="M18 12l-4 4"/><path d="M14 8l-4 4"/><path d="M10 12l-4-4"/><circle cx="12" cy="12" r="10"/></svg> Non-Veg
            </button>
          </div>

          <div class="menu-toolbar__category-chips" role="group" aria-label="Menu categories" id="category-chips">
            <!-- Populated by JS -->
          </div>
        </div>

        <!-- MENU GRID -->
        <div class="menu-grid" id="menu-grid" role="list" aria-label="Menu items">
          <!-- Populated by JS -->
        </div>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  <script src="js/support.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
